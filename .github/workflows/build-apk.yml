name: Build CashBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CashBook project
        run: |
          mkdir -p extracted
          unzip -q "./CashBook-Android-V10.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/CashBookAndroid
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-debug-apk
          path: extracted/CashBookAndroid/app/build/outputs/apk/debug/app-debug.apk
