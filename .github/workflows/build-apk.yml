name: Build CashBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CashBook project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          unzip -o "$ZIP" -d extracted

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/CashBookAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-debug-apk
          path: extracted/CashBookAndroid/app/build/outputs/apk/debug/app-debug.apk
