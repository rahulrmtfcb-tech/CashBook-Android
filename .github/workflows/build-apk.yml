name: Build CashBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CashBook project
        run: |
          mkdir -p extracted
          unzip -q "./CashBook-Android-V10.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          echo "Finding Gradle project..."
          GRADLEW=$(find extracted -name gradlew -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo "Project structure:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug --no-daemon

          - name: Upload APK
           uses: actions/upload-artifact@v4
           with:
          name: CashBook-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
