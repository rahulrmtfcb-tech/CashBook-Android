name: Build CashBook APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CashBook project
        run: |
          mkdir -p extracted
          unzip -q "CashBook-Android-V14.4.3-RMT-LOGO-SPLASH-4SEC.zip" -d extracted

          echo "=== Extracted structure ==="
          find extracted -maxdepth 5 -type f | head -300

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "=== Building from ==="
          pwd

          echo "=== Project files ==="
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CashBook-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
